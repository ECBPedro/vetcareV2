<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetCare – Gestão de usuários</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/componentes.css">
</head>
<body>
  <header class="topo">
    <strong>VetCare</strong>
    <div>
      <span id="nome-usuario"></span> · <span id="perfil-usuario"></span>
      <button id="sair" class="botao">Sair</button>
    </div>
  </header>

  <div class="corpo">
    <nav id="menu" class="menu"></nav>
    <main class="conteudo">
      <div class="cabecalho cabecalho-acao">
        <div><h1>Gestão de usuários</h1><p class="subtitulo">Cadastre, edite e inative usuários.</p></div>
        <button type="button" id="novo" class="botao">+ Novo usuário</button>
      </div>
      <p id="aviso" class="aviso" hidden></p>

      <form id="form-usuario" class="cartao formulario" novalidate hidden style="margin-bottom:24px">
        <h2 id="titulo-form">Novo usuário</h2>
        <input type="hidden" name="id">
        <div class="linha">
          <div><label for="u-nome">Nome</label><input id="u-nome" name="nome"></div>
          <div><label for="u-email">E-mail</label><input id="u-email" name="email" type="email"></div>
        </div>
        <div class="linha">
          <div><label for="u-perfil">Perfil</label><select id="u-perfil" name="perfil"></select></div>
          <div><label for="u-senha" id="rotulo-senha">Senha</label><input id="u-senha" name="senha" type="password" autocomplete="new-password"></div>
        </div>
        <div class="acoes"><button type="button" id="cancelar" class="botao secundario">Cancelar</button><button type="submit" class="botao">Salvar</button></div>
      </form>

      <div class="filtros">
        <div><label for="busca">Buscar usuário</label><input id="busca" type="search" placeholder="Nome ou e-mail"></div>
        <div><label for="filtro-perfil">Perfil</label><select id="filtro-perfil"></select></div>
      </div>
      <div class="cartao" style="padding:0;overflow:hidden">
        <table class="tabela" style="margin:0"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table>
      </div>
      <p class="subtitulo">Excluir significa inativar: o histórico é preservado.</p>
    </main>
  </div>

  <script type="module" src="../js/app/usuarios.js"></script>
</body>
</html>
